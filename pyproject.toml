[project]
name = "cutly"
version = "0.1.0"
description = "Editor de vídeo API-first para convertir directos largos en clips cortos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "rq>=1.16",
    "alembic>=1.13",
    "numpy>=2.5.4",
    "resvg-py>=0.5.0",
    "defusedxml>=0.7.1",
    "pillow>=13.0.0",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
ai = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]

[project.scripts]
cutly = "cutly.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutly"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() en defaults es el patrón de FastAPI

[tool.ruff.lint.per-file-ignores]
"src/cutly/services/render/*" = ["E501"]
"src/cutly/services/scene/*" = ["E501"]
"src/cutly/schema/scene.py" = ["E501"]
"effects/*" = ["E501"]
"tests/*" = ["E501"]
"src/cutly/services/verify/*" = ["E501"]
"src/cutly/services/assets/*" = ["E501"]
"src/cutly/services/presets/*" = ["E501"]
"src/cutly/worker/*" = ["E501"]
"src/cutly/api/routers/*" = ["E501"]
"src/cutly/registry/*" = ["E501"]
"src/cutly/api/routers/effects.py" = ["E501"]  # grafos de FFmpeg: líneas densas a propósito
"src/cutly/db/migrations/*" = ["E501", "F401", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

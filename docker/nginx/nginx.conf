# Nginx: proxy a la API, subidas grandes sin buffering y vídeo con rangos.
server {
    listen 80;
    server_name editor.cogny.es;

    client_max_body_size 100m;          # los trozos de subida son de 32 MB
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;    # subidas grandes: no bufferizar en disco
        proxy_read_timeout 600s;
    }

    # Proxies de vídeo: solo con sesión válida (la API responde 200/401 en /auth/me)
    location /media-files/ {
        auth_request /_auth;
        alias /data/media/;
        add_header Accept-Ranges bytes;
        mp4;
    }
    location = /_auth {
        internal;
        proxy_pass http://api:8000/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        root /app/web;
        try_files $uri /index.html;
    }
}

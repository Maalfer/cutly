# editor.cogny.es — Cutly (API + web en 127.0.0.1:8321, sin Docker en este VPS)
server {
    listen 80;
    listen [::]:80;
    server_name editor.cogny.es;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name editor.cogny.es;

    ssl_certificate     /etc/letsencrypt/live/editor.cogny.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editor.cogny.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Trozos de subida de 32 MB (sin buffering a disco) y vídeo con rangos.
    client_max_body_size 64M;
    proxy_request_buffering off;
    proxy_buffering off;

    access_log /var/log/nginx/editor.cogny.es.access.log;
    error_log  /var/log/nginx/editor.cogny.es.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:8321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 10s;
    }
}

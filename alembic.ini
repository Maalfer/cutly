# Uso en desarrollo (¡fija SIEMPRE CUTLY_DATABASE_URL para no tocar la BD de producción!):
#   CUTLY_DATABASE_URL=sqlite:////tmp/x.db uv run alembic upgrade head
#   CUTLY_DATABASE_URL=sqlite:////tmp/x.db uv run alembic revision --autogenerate -m "mensaje"
[alembic]
script_location = src/cutly/db/migrations

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

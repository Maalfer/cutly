services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    command: uvicorn cutly.api.app:app --host 0.0.0.0 --port 8000 --proxy-headers
    env_file: .env
    environment:
      CUTLY_DATA_DIR: /data
      CUTLY_DATABASE_URL: sqlite:////data/cutly.db
      CUTLY_REDIS_URL: redis://redis:6379/0
    volumes: ["cutly-data:/data"]
    depends_on: [redis]
    mem_limit: 512m

  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    command: python -m cutly.worker.rq_worker
    env_file: .env
    environment:
      CUTLY_DATA_DIR: /data
      CUTLY_DATABASE_URL: sqlite:////data/cutly.db
      CUTLY_REDIS_URL: redis://redis:6379/0
    volumes: ["cutly-data:/data"]
    depends_on: [redis]
    # Límites pensados para el VPS pequeño actual; súbelos al migrar.
    mem_limit: 1g
    cpus: 1.5
    # GPU (VPS futuro): descomenta y usa CUTLY_WHISPER_DEVICE=cuda
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]   # en producción: 80/443 con certbot (Fase 3)
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/app/web:ro
      - cutly-data:/data:ro
    depends_on: [api]

volumes:
  cutly-data:
